<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Stylised slot car">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="gLane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="58%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#86efac" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#bbf7d0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <!-- soft intentional glow (no hard crop) -->
  <ellipse cx="370" cy="175" rx="250" ry="150" fill="url(#glow)"/>
  <!-- track lanes -->
  <g opacity=".9">
    <rect x="40" y="78" width="560" height="44" rx="10" fill="url(#gLane)"/>
    <rect x="40" y="138" width="560" height="44" rx="10" fill="url(#gLane)"/>
    <rect x="40" y="198" width="560" height="44" rx="10" fill="url(#gLane)"/>
    <rect x="40" y="258" width="560" height="44" rx="10" fill="url(#gLane)"/>
    <!-- slot guides -->
    <rect x="40" y="98" width="560" height="4" rx="2" fill="#94a3b8"/>
    <rect x="40" y="158" width="560" height="4" rx="2" fill="#94a3b8"/>
    <rect x="40" y="218" width="560" height="4" rx="2" fill="#94a3b8"/>
    <rect x="40" y="278" width="560" height="4" rx="2" fill="#94a3b8"/>
  </g>
  <!-- speed dashes (intentional motif, behind car) -->
  <g stroke="#16a34a" stroke-width="3" stroke-linecap="round" opacity=".35">
    <path d="M70 120 H150"/><path d="M90 180 H190"/><path d="M60 240 H140"/><path d="M100 300 H175"/>
  </g>
  <!-- car body on lane 2 (top-down stylised) -->
  <g filter="url(#soft)" transform="translate(250 118)">
    <!-- shadow -->
    <ellipse cx="120" cy="78" rx="95" ry="18" fill="#0f172a" opacity=".10"/>
    <!-- chassis -->
    <path d="M28 40
             C40 12, 70 4, 120 4
             C170 4, 200 12, 212 40
             C220 52, 220 70, 212 82
             C200 108, 170 116, 120 116
             C70 116, 40 108, 28 82
             C20 70, 20 52, 28 40 Z" fill="url(#gBody)"/>
    <!-- canopy -->
    <ellipse cx="118" cy="58" rx="38" ry="26" fill="#ecfdf5" opacity=".92"/>
    <ellipse cx="118" cy="58" rx="22" ry="14" fill="#bbf7d0"/>
    <!-- guide flag -->
    <rect x="112" y="108" width="16" height="22" rx="3" fill="#14532d"/>
    <circle cx="120" cy="134" r="7" fill="#052e16"/>
    <!-- headlights -->
    <circle cx="38" cy="48" r="6" fill="#fef9c3"/>
    <circle cx="38" cy="72" r="6" fill="#fef9c3"/>
    <!-- side detail lines -->
    <path d="M55 40 H175" stroke="#bbf7d0" stroke-width="2" opacity=".7"/>
    <path d="M55 80 H175" stroke="#14532d" stroke-width="2" opacity=".35"/>
  </g>
</svg>
